services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reconcile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reconcile}
      POSTGRES_DB: ${POSTGRES_DB:-reconcile}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reconcile} -d ${POSTGRES_DB:-reconcile}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-reconcile}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-reconcile}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  minio-init:
    image: pgsty/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-raw-invoices}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}" &&
        echo "MinIO bucket initialized: $${MINIO_BUCKET}"

  migrate:
    image: migrate/migrate:v4.18.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-reconcile}:${POSTGRES_PASSWORD:-reconcile}@postgres:5432/${POSTGRES_DB:-reconcile}?sslmode=disable"
      - "up"

  api:
    build:
      context: .
      target: api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      PORT: ${API_PORT:-8080}
      DATABASE_URL: postgres://${POSTGRES_USER:-reconcile}:${POSTGRES_PASSWORD:-reconcile}@postgres:5432/${POSTGRES_DB:-reconcile}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-reconcile}:${RABBITMQ_PASS:-reconcile}@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-raw-invoices}
      MINIO_USE_SSL: "false"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-reconcile}:${POSTGRES_PASSWORD:-reconcile}@postgres:5432/${POSTGRES_DB:-reconcile}?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-reconcile}:${RABBITMQ_PASS:-reconcile}@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-raw-invoices}
      MINIO_USE_SSL: "false"
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  minio_data:
